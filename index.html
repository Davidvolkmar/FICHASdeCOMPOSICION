<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de Composición · Vivienda</title>
<meta name="description" content="Presentación interactiva: diseña tu casa de afuera hacia adentro con 7 decisiones y 12 principios de composición.">
<meta property="og:title" content="Ficha de Composición · Diseña tu casa de afuera hacia adentro">
<meta property="og:description" content="Presentación interactiva: 7 decisiones, 12 principios, reto y tu ficha.">
<meta name="theme-color" content="#E4572E">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --a:#E4572E;--a2:#F28B67;--tint:#FCEAE3;--ink:#161616;--ink2:#3b3b3b;--g1:#F2F2EF;--g2:#DADAD5;--g3:#85857F;--dark:#121212;
  --fd:'Barlow Condensed','Bahnschrift','Arial Narrow',sans-serif;--fb:'Barlow','Bahnschrift',Arial,sans-serif;
  --top:60px;--bot:76px;--gut:clamp(16px,3.2vw,56px);--r:clamp(14px,1.6vmin,22px);
  --h1:clamp(44px,9vmin,140px);--h2:clamp(36px,7vmin,104px);--lead:clamp(16px,2.3vmin,26px);--body:clamp(15px,1.9vmin,21px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--fb);font-size:var(--body);line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
svg{display:block;max-width:100%}
h1,h2,h3{font-family:var(--fd);text-transform:uppercase;line-height:.92;margin:0;letter-spacing:-.01em}
h2{font-size:var(--h2);font-weight:800}
h2 em,h1 em{font-style:normal;color:var(--a)}
.kicker{font-family:var(--fd);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(13px,1.6vmin,18px);color:var(--a)}
.lead{font-size:var(--lead);color:var(--ink2);margin:0;max-width:34em}

/* ---------- barras ---------- */
.top{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:30;display:flex;align-items:center;gap:10px;padding:0 var(--gut);padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--g2)}
.brand{font-family:var(--fd);font-weight:800;font-size:20px;white-space:nowrap}
.brand b{color:var(--a)}
.stitle{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g3);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ib{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;flex:none;font-size:18px;line-height:1}
.pill{height:44px;border-radius:99px;border:none;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:0 6px 0 14px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.pill .dots{display:flex;gap:3px}
.pill .dots i{width:7px;height:7px;border-radius:50%;background:#555}
.pill .dots i.on{background:var(--a)}
.pill .n{background:var(--a);border-radius:99px;padding:6px 10px}
.bot{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bot) + env(safe-area-inset-bottom));padding:0 var(--gut) env(safe-area-inset-bottom);z-index:30;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--g2)}
.nav-b{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:26px;display:grid;place-items:center;flex:none;transition:transform .15s}
.nav-b:active{transform:scale(.92)}
.nav-b.next{background:var(--a);border-color:var(--a);color:#fff}
.nav-b:disabled{opacity:.25}
.prog{flex:1;display:flex;gap:4px;align-items:center;height:56px;min-width:0}
.prog button{flex:1;height:28px;border:none;background:none;padding:0;display:flex;align-items:center}
.prog button i{display:block;width:100%;height:6px;border-radius:3px;background:var(--g2);transition:background .3s,height .3s}
.prog button.done i{background:var(--a2)}
.prog button.on i{background:var(--a);height:10px}
.count{font-family:var(--fd);font-weight:800;font-size:20px;min-width:62px;text-align:center}
body.dk .top,body.dk .bot{background:rgba(18,18,18,.9);border-color:#2a2a2a;color:#fff}
body.dk .stitle{color:#9a9a93}
body.dk .ib,body.dk .nav-b:not(.next){background:#1e1e1e;border-color:#555;color:#fff}
body.dk .prog button i{background:#3a3a3a}
body.dk .prog button.done i{background:#8a4a35}
body.dk .prog button.on i{background:var(--a)}
@media(max-width:640px){.stitle,.brand{display:none}.top{justify-content:flex-end}.count{display:none}}
.hint{position:fixed;bottom:calc(var(--bot) + 14px);left:50%;transform:translateX(-50%);z-index:29;background:var(--ink);color:#fff;border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}

/* ---------- diapositivas ---------- */
.deck{position:fixed;inset:0;touch-action:pan-y}
.slide{position:absolute;inset:0;padding:calc(var(--top) + clamp(16px,3vmin,40px)) var(--gut) calc(var(--bot) + clamp(16px,3vmin,40px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(60px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;background:#fff}
.slide.past{transform:translateX(-60px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s}
.slide>.in{margin:auto 0;width:100%;max-width:1500px;align-self:center}
.slide.dark{background:var(--dark);color:#fff}
.slide.dark .lead{color:#bdbdb6}
.slide.soft{background:var(--g1)}
.slide.acc{background:var(--a);color:#fff}
.stag>*{opacity:0;transform:translateY(22px)}
.active .stag>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.active .stag>*:nth-child(2){animation-delay:.08s}.active .stag>*:nth-child(3){animation-delay:.16s}.active .stag>*:nth-child(4){animation-delay:.24s}.active .stag>*:nth-child(5){animation-delay:.32s}.active .stag>*:nth-child(6){animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}

.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:10px 22px;border-radius:99px;font-weight:700;text-decoration:none;font-size:clamp(15px,1.8vmin,19px);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.dk{background:var(--ink);color:#fff}
.dark .btn:not(.pri){background:#1f1f1f;color:#fff;border-color:#4a4a4a}

/* portada */
.hero{display:grid;gap:clamp(16px,3vmin,40px);align-items:center}
@media(min-aspect-ratio:1/1){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}
.stickers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(12px,2vmin,24px)}
.sticker{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(12px,1.6vmin,17px);padding:6px 14px;border-radius:99px;border:1.5px solid var(--ink);background:#fff}
.sticker.hot{background:var(--a);border-color:var(--a);color:#fff;transform:rotate(-3deg)}
.hero h1{font-size:var(--h1);font-weight:800}
.hero h1 .o{color:transparent;-webkit-text-stroke:2px var(--ink)}
.hero .lead{margin:clamp(12px,2.4vmin,28px) 0}
.hero-vis{position:relative;width:100%;aspect-ratio:5/4;max-height:62vh;margin:0 auto}
.hero-vis svg{width:100%;height:100%}
.badge{position:absolute;right:4%;top:4%;background:var(--ink);color:#fff;font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(12px,1.6vmin,17px);letter-spacing:.06em;padding:10px 14px;border-radius:14px;transform:rotate(4deg);line-height:1.1}
.badge b{display:block;font-size:clamp(22px,3.4vmin,40px);color:var(--a2)}

/* actividad */
.head{display:grid;gap:clamp(8px,1.4vmin,16px);margin-bottom:clamp(16px,3vmin,36px)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vmin,16px);margin-bottom:clamp(12px,2vmin,24px)}
.nums div{background:var(--g1);border-radius:var(--r);padding:clamp(12px,2.2vmin,26px)}
.nums b{display:block;font-family:var(--fd);font-weight:800;font-size:clamp(48px,11vmin,150px);line-height:.85;color:var(--a)}
.nums span{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(14px,2.2vmin,26px);line-height:1}
.steps{display:grid;gap:clamp(8px,1.4vmin,16px)}
@media(min-width:720px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{border:2px solid var(--ink);border-radius:var(--r);padding:clamp(14px,2vmin,24px);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:#fff}
.step .n{width:clamp(38px,5vmin,56px);height:clamp(38px,5vmin,56px);border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:clamp(20px,3vmin,30px)}
.step h3{font-size:clamp(26px,4vmin,44px);font-weight:800}
.step p{grid-column:1/-1;margin:0;color:var(--ink2)}
.step svg{grid-column:1/-1;width:100%;height:clamp(60px,10vmin,120px)}
.deliver{margin-top:clamp(10px,2vmin,22px);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deliver b{font-family:var(--fd);text-transform:uppercase;font-size:clamp(18px,2.6vmin,28px);margin-right:6px}
.deliver span{background:var(--tint);border-radius:99px;padding:6px 14px;font-weight:600;font-size:clamp(13px,1.7vmin,18px)}
.deliver span::before{content:"✓ ";color:var(--a);font-weight:800}

/* ruta */
.route{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.4vmin,16px)}
@media(min-width:720px){.route{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px) and (min-aspect-ratio:4/3){.route{grid-template-columns:repeat(7,1fr)}}
.rt{border:1.5px solid #3a3a3a;background:#1d1d1d;border-radius:var(--r);padding:clamp(10px,1.6vmin,18px);text-align:left;display:grid;gap:8px;position:relative;transition:transform .2s,border-color .2s}
.rt:hover,.rt:active{transform:translateY(-4px);border-color:var(--a)}
.rt .num{font-family:var(--fd);font-weight:800;font-size:clamp(30px,5vmin,60px);line-height:.85;color:var(--a)}
.rt .nm{font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:clamp(18px,2.6vmin,28px);line-height:1}
.rt .ic{background:#fff;border-radius:10px;padding:8px;aspect-ratio:88/50}
.rt .ic svg{width:100%;height:100%}
.rt .ok{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--a);color:#fff;display:none;place-items:center;font-weight:800;font-size:14px}
.rt.sel .ok{display:grid}
.depth{margin-top:clamp(14px,2.4vmin,28px);height:12px;border-radius:6px;background:linear-gradient(90deg,#3a2a24,var(--a));position:relative}
.depth-l{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#bdbdb6;font-size:clamp(13px,1.6vmin,17px)}

/* nivel */
.lv{display:grid;gap:clamp(14px,2.4vmin,32px);align-items:stretch}
@media(min-aspect-ratio:1/1){.lv{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}}
.stage{background:var(--dark);border-radius:calc(var(--r) + 6px);color:#fff;padding:clamp(14px,2.2vmin,28px);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.stage .bn{display:flex;align-items:baseline;gap:12px}
.stage .bn b{font-family:var(--fd);font-weight:800;font-size:clamp(54px,10vmin,140px);line-height:.8;color:var(--a)}
.stage .bn span{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(13px,1.6vmin,18px);color:#9a9a93}
.stage svg{width:100%;flex:1;min-height:clamp(180px,34vmin,520px)}
.stage p{margin:0;color:#d4d4cd}
.stage .q{color:var(--a2);font-weight:600;margin-top:8px}
.stage .dots{position:absolute;top:clamp(14px,2.2vmin,28px);right:clamp(14px,2.2vmin,28px);display:flex;gap:5px}
.stage .dots i{width:18px;height:5px;border-radius:3px;background:#3a3a3a}
.stage .dots i.on{background:var(--a)}
.lvr{display:flex;flex-direction:column;gap:clamp(10px,1.8vmin,20px);justify-content:center}
.lvr h2 small{display:block;font-family:var(--fb);text-transform:none;font-weight:500;font-size:var(--lead);color:var(--g3);letter-spacing:0;margin-top:8px;line-height:1.3}
.chosen{align-self:flex-start;font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(13px,1.6vmin,17px);letter-spacing:.06em;padding:6px 14px;border-radius:99px;background:var(--g1);color:var(--g3)}
.chosen.ok{background:var(--a);color:#fff}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.4vmin,16px)}
.opt{position:relative;border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:clamp(8px,1.4vmin,14px);text-align:left;display:grid;gap:8px;transition:transform .2s,box-shadow .2s,background .2s}
.opt:active{transform:scale(.97)}
.opt .ico{background:var(--g1);border-radius:10px;padding:clamp(6px,1vmin,12px);aspect-ratio:88/48}
.opt .ico svg{width:100%;height:100%}
.opt .lbl{font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:clamp(18px,2.8vmin,32px);line-height:1;padding-right:44px}
.opt .pick{position:absolute;right:clamp(8px,1.2vmin,12px);bottom:clamp(8px,1.2vmin,12px);width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.opt.sel{background:var(--tint);border-color:var(--a);box-shadow:0 6px 0 var(--a)}
.opt.sel .pick{background:var(--a);border-color:var(--a);color:#fff}
.opt.otro{border-style:dashed;border-color:var(--a)}
.opt.otro .ico{background:var(--tint);display:grid;place-items:center;color:var(--a);font-family:var(--fd);font-weight:800;font-size:clamp(34px,6vmin,64px)}
.opt.otro .lbl{color:var(--a)}
.opt .sub{font-size:13px;color:var(--g3);font-weight:600;margin-top:-4px;padding-right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{font-size:clamp(13px,1.6vmin,16px);color:var(--g3);font-weight:600}

/* principios */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.2vmin,14px)}
@media(min-width:620px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px) and (min-aspect-ratio:4/3){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pc{border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:clamp(6px,1vmin,10px);text-align:left;display:grid;gap:6px;transition:transform .2s}
.pc:active{transform:scale(.97)}
.pc .dg{background:var(--g1);border-radius:10px;aspect-ratio:168/64;padding:4px}
.pc .dg svg{width:100%;height:100%}
.pc .t{display:flex;gap:8px;align-items:baseline;padding:0 4px 2px}
.pc .t b{font-family:var(--fd);color:var(--a);font-weight:800;font-size:clamp(15px,2vmin,22px)}
.pc .t span{font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:clamp(17px,2.4vmin,28px);line-height:1}
.pc.on{border-color:var(--a);background:var(--tint)}

/* ejemplo */
.ex{display:grid;gap:clamp(14px,2.4vmin,32px);align-items:center}
@media(min-aspect-ratio:1/1){.ex{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.formula{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:clamp(12px,2vmin,24px) 0}
.formula span{border:2px solid var(--ink);border-radius:99px;padding:8px 18px;font-weight:700;font-size:clamp(15px,2.1vmin,24px);background:#fff}
.formula i{font-style:normal;font-family:var(--fd);font-weight:800;color:var(--a);font-size:clamp(24px,3.4vmin,40px)}
.formula b{font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:clamp(28px,4.4vmin,56px);color:var(--a)}
.ex svg{width:100%;aspect-ratio:5/4;max-height:60vh}

/* reto */
.qwrap{display:grid;gap:clamp(14px,2.4vmin,32px);align-items:center}
@media(min-aspect-ratio:1/1){.qwrap{grid-template-columns:minmax(0,.8fr) minmax(0,1fr)}}
.qbox{width:100%;max-width:520px;justify-self:center;background:linear-gradient(160deg,#262626,#151515);border:1px solid #333;border-radius:26px;padding:clamp(14px,2vmin,22px);min-height:min(560px,64vh);display:flex;flex-direction:column}
.qbars{display:flex;gap:4px;margin-bottom:14px}
.qbars i{flex:1;height:4px;border-radius:2px;background:#3a3a3a;position:relative;overflow:hidden}
.qbars i.done{background:var(--a)}
.qbars i.cur::after{content:"";position:absolute;inset:0;background:var(--a2);animation:fillbar 1s ease forwards;transform-origin:left}
@keyframes fillbar{from{transform:scaleX(0)}}
.qtag{font-family:var(--fd);text-transform:uppercase;font-weight:700;letter-spacing:.1em;color:var(--a2);font-size:14px}
.qq{font-family:var(--fd);font-weight:800;font-size:clamp(26px,4vmin,40px);line-height:1;margin:8px 0 12px;text-transform:uppercase}
.qdg{background:#fff;border-radius:16px;padding:10px;margin-bottom:12px;aspect-ratio:168/72}
.qdg svg{width:100%;height:100%}
.qopts{display:grid;gap:8px;margin-top:auto}
.qopt{border:1.5px solid #4a4a4a;background:#1f1f1f;border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;font-size:clamp(16px,2vmin,20px);min-height:52px}
.qopt.right{background:#1f3b2a;border-color:#4cc27a}
.qopt.wrong{background:#3b1f1f;border-color:#e45a5a}
.qfb{min-height:40px;margin-top:10px;color:#d4d4cd;font-size:15px}
.qend{text-align:center;margin:auto 0;display:grid;gap:14px;justify-items:center}
.qend .score{font-family:var(--fd);font-weight:800;font-size:clamp(90px,16vmin,160px);line-height:.85;color:var(--a)}

/* mi ficha */
.mf{display:grid;gap:clamp(12px,2vmin,24px)}
@media(min-width:900px){.mf{grid-template-columns:1.1fr .9fr;align-items:start}}
.card{border:2px solid var(--ink);border-radius:var(--r);padding:clamp(12px,2vmin,22px);background:#fff}
.mf-rows{display:grid;gap:6px}
.mf-row{display:grid;grid-template-columns:34px 1fr 84px;gap:10px;align-items:center;padding:6px 8px;border-radius:12px;background:var(--g1);border:none;text-align:left;width:100%}
.mf-row .n{font-family:var(--fd);font-weight:800;color:var(--a);font-size:22px}
.mf-row .lv2{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:12px;color:var(--g3);letter-spacing:.06em;display:block}
.mf-row .ch{font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:clamp(17px,2.2vmin,22px);line-height:1}
.mf-row .ch.empty{color:#b5b5ae}
.mf-row .mini{background:#fff;border-radius:8px;height:46px;padding:3px;display:grid;place-items:center}
.mf-row .mini svg{width:100%;height:100%}
.mf-row.ok{background:var(--tint)}
.progress{height:10px;border-radius:5px;background:var(--g1);overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--a);width:0;transition:width .5s}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.field input,.field textarea{font:inherit;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
.field textarea{min-height:96px;resize:vertical}

const poly=(pts,o={})=>`<polygon points="${pts.map(p=>p.map(r2).join(',')).join(' ')}" fill="${o.fill||'none'}" stroke="${o.stroke||INK}" stroke-width="${o.sw||1}" stroke-linejoin="round"${o.op!=null?` opacity="${o.op}"`:''}${o.dash?` stroke-dasharray="${o.dash}"`:''}/>`;

const G=(x,y,inner,cls,st)=>`<g transform="translate(${r2(x)},${r2(y)})"${cls?` class="${cls}"`:''}${st?` style="${st}"`:''}>${inner}</g>`;
function arrow(x1,y1,x2,y2,o={}){const c=o.stroke||A,sw=o.sw||1.4,ang=Math.atan2(y2-y1,x2-x1),L=o.head||4.2;const bx=x2-Math.cos(ang)*L,by=y2-Math.sin(ang)*L,nx=-Math.sin(ang)*L*.55,ny=Math.cos(ang)*L*.55;return line(x1,y1,bx,by,{stroke:c,sw})+poly([[x2,y2],[bx+nx,by+ny],[bx-nx,by-ny]],{fill:c,stroke:c,sw:.5});}

// isometría simple con ajuste al área
const C30=Math.cos(Math.PI/6);
const proj=(x,y,z)=>[(x-y)*C30,(x+y)*.5-z];
function iso(boxes,aw,ah,pad=2,acc=-1){
  const faces=[];
  boxes.map((b,i)=>({b,i})).sort((p,q)=>(p.b[0]+p.b[1]+p.b[2]+p.b[3]/2+p.b[4]/2)-(q.b[0]+q.b[1]+q.b[2]+q.b[3]/2+q.b[4]/2)).forEach(({b,i})=>{
    const [x,y,z,w,d,h]=b,a=i===acc;
    faces.push([[[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],a?'#F3A98F':'#C9C9C3'],[[[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],a?'#F7C7B6':G2],[[[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],a?TINT:'#fff']);
  });
  const pts=faces.flatMap(f=>f[0].map(p=>proj(...p)));
  const mnx=Math.min(...pts.map(p=>p[0])),mxx=Math.max(...pts.map(p=>p[0])),mny=Math.min(...pts.map(p=>p[1])),mxy=Math.max(...pts.map(p=>p[1]));
  const k=Math.min((aw-2*pad)/(mxx-mnx),(ah-2*pad)/(mxy-mny)),ox=(aw-(mxx-mnx)*k)/2-mnx*k,oy=(ah-(mxy-mny)*k)/2-mny*k;
  return faces.map(([f,fill])=>poly(f.map(p=>{const q=proj(...p);return[ox+q[0]*k,oy+q[1]*k]}),{fill,sw:.8})).join('');
}

// ---------- animación "dibujo" ----------
function drawIn(svg,delay=0){
  if(!svg||reduce)return;
  const els=svg.querySelectorAll('line,rect,polygon,path,circle,text');
  els.forEach((el,i)=>{
    const d=delay+Math.min(i*22,900);
    if(el.tagName==='text'){el.style.transition='none';el.style.opacity=0;requestAnimationFrame(()=>{el.style.transition=`opacity .5s ${d+300}ms`;el.style.opacity=1;});return;}
    let L=0;try{L=el.getTotalLength();}catch(e){}
    const hasStroke=el.getAttribute('stroke')&&el.getAttribute('stroke')!=='none';
    el.style.transition='none';
    if(hasStroke&&L>0){el.style.strokeDasharray=L;el.style.strokeDashoffset=L;}
    el.style.fillOpacity=0;
    el.getBoundingClientRect();
    requestAnimationFrame(()=>{
      el.style.transition=`stroke-dashoffset .8s cubic-bezier(.6,0,.3,1) ${d}ms, fill-opacity .5s ease ${d+380}ms`;
      el.style.strokeDashoffset=0;el.style.fillOpacity=1;
      setTimeout(()=>{el.style.strokeDasharray='';el.style.strokeDashoffset='';el.style.transition='';},d+1300);
    });
  });
}

  if(st.foot>0)out.push(`<polygon points="${pts(SC.foot.map(p=>P(p[0],p[1],0)))}" fill="${A}" fill-opacity="${.12*st.foot}" stroke="${A}" stroke-width="2.4" opacity="${st.foot}" stroke-linejoin="round"/>`);

  if(st.lot>0){const p=P(2.3,8.9,0);out.push(`<g opacity="${st.lot}" transform="translate(${r2(p[0])},${r2(p[1])})"><circle cx="0" cy="-${r2(k*.72)}" r="${r2(k*.09)}" fill="${A}"/><line x1="0" y1="-${r2(k*.6)}" x2="0" y2="-${r2(k*.25)}" stroke="${A}" stroke-width="2.4" stroke-linecap="round"/><line x1="0" y1="-${r2(k*.25)}" x2="-3" y2="0" stroke="${A}" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="-${r2(k*.25)}" x2="3" y2="0" stroke="${A}" stroke-width="2" stroke-linecap="round"/></g>`);}
  return out.join('');
}


// ---------- volumetrías 3D animadas de cada estrategia (viewBox 0 0 400 300) ----------
const V3=(function(){
  const VW=400,VH=300;
  const R=(x,y,w,d)=>[[x,y],[x+w,y],[x+w,y+d],[x,y+d]];
  const area=fp=>{let s=0;for(let i=0;i<fp.length;i++){const a=fp[i],b=fp[(i+1)%fp.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;};
  const cen=fp=>[fp.reduce((m,p)=>m+p[0],0)/fp.length,fp.reduce((m,p)=>m+p[1],0)/fp.length];
  function prism(fp,h,kind='m',z0=0){
    if(area(fp)<0)fp=fp.slice().reverse();

    for(let i=0;i<fp.length;i++){const a=fp[i],b=fp[(i+1)%fp.length],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;

  function winY(o,y,x0,x1,z0,z1){o.faces.push({p:[[x0,y+.02,z0],[x1,y+.02,z0],[x1,y+.02,z1],[x0,y+.02,z1]],n:[0,1,0],dec:1});}

    {p:[[0,0,0],[W,0,0],[W,0,h],[0,0,h]],n:[0,-1,0]},{p:[[0,D,0],[W,D,0],[W,D,h],[0,D,h]],n:[0,1,0]},

    {p:[[0,m,rz],[W,m,rz],[W,D,h],[0,D,h]],n:[0,rz-h,m],roof:1},{p:[[0,0,h],[W,0,h],[W,m,rz],[0,m,rz]],n:[0,-(rz-h),m],roof:1}]};}

      {p:[[0,0,0],[0,D,0],[0,D,z(0)],[0,0,z(0)]],n:[-1,0,0]},{p:[[W,0,0],[W,D,0],[W,D,z(W)],[W,0,z(W)]],n:[1,0,0]}];

  function sCurve(){const top=[],bot=[];for(let i=0;i<=16;i++){const x=i/16*6,y=1.8+Math.sin(i/16*Math.PI*2)*1.1;top.push([x,y]);bot.push([x,y+1.5]);}return prism(top.concat(bot.reverse()),1.6);}

  const S={
    aislada:()=>({ground:LOT(),objs:[box(2,1.5,4,3,1.6)],trees:[[.9,4.9],[7.1,1]],paths:[]}),

    modular:()=>{const o=[];[[0,0,0],[1.4,0,0],[2.8,0,0],[0,1.4,0],[0,2.8,0],[2.8,1.4,0],[0,0,1.4],[1.4,0,1.4],[0,1.4,1.4]].forEach(([x,y,z])=>o.push(box(x+.04,y+.04,1.32,1.32,1.32,'m',z)));return {ground:BASE(-1,-1,6.2,6.2),objs:o};},
    ortogonal:()=>({ground:BASE(-1,-1,7,6.6),objs:[prism([[0,0],[5,0],[5,2],[2,2],[2,4.6],[0,4.6]],1.7)]}),

    plana:()=>{const s=box(-.25,-.25,5.5,3.7,.18,'acc',1.6);s.bias=.01;return {ground:BASE(-1,-1,7,5.2),objs:[box(0,0,5,3.2,1.6),s],people:[[5.8,3.6]]};},
    inclinada:()=>({ground:BASE(-1,-1,7,5.2),objs:[gable(5,3.2,1.4,2.7)],people:[[5.8,3.6]]}),

    laterales:()=>({ground:LOT().concat([GREEN(5.4,0,2.6,6),GREEN(0,4.4,5.4,1.6)]),objs:[NB(-2.6,2.6,2.2),box(0,0,5.4,4.4,1.8)],trees:[[6.7,2],[2,5.3]]}),
    intermedios:()=>({ground:LOT().concat([GREEN(2.5,1.8,3,1.2),GREEN(0,4.6,3,1.4)]),objs:[NB(-2.6,2.6,2.2),NB(8,2.6,1.9),box(0,0,8,1.8,1.8),box(0,1.8,2.5,1.2,1.8),box(5.5,1.8,2.5,1.2,1.8),box(0,3,8,1.6,1.8),box(3,4.6,5,1.4,1.8)],trees:[[4,2.4],[1.5,5.3]]}),
    central:()=>({ground:LOT().concat([GREEN(2,1.8,4,2.4)]),objs:[NB(-2.6,2.6,2.2),NB(8,2.6,1.9),box(0,0,8,1.8,1.8),box(0,1.8,2,2.4,1.8),box(6,1.8,2,2.4,1.8),box(0,4.2,8,1.8,1.8)],trees:[[4,3]]}),
    horizontal:()=>{const o=box(0,0,6,3,2.2);winY(o,3,.4,5.6,.45,1);winY(o,3,.4,5.6,1.35,1.9);winX(o,6,.3,2.7,.45,1);winX(o,6,.3,2.7,1.35,1.9);return {ground:BASE(-1,-1,8,5),objs:[o],people:[[6.8,3.6]]};},
    vertical:()=>{const o=box(0,0,6,3,2.2);for(let i=0;i<8;i++)winY(o,3,.45+i*.72,.75+i*.72,.3,1.95);for(let i=0;i<4;i++)winX(o,6,.35+i*.72,.65+i*.72,.3,1.95);return {ground:BASE(-1,-1,8,5),objs:[o],people:[[6.8,3.6]]};},
    puntual:()=>{const o=box(0,0,6,3,2.2);[[.5,1.3,.4,1.1],[1.9,2.4,1.3,1.8],[3,4.2,.5,1],[4.6,5.4,1.2,1.95],[2.6,3.1,.3,.8]].forEach(w=>winY(o,3,...w));[[.4,1.1,1.2,1.9],[1.6,2.6,.4,.9]].forEach(w=>winX(o,6,...w));return {ground:BASE(-1,-1,8,5),objs:[o],people:[[6.8,3.6]]};},
    lineal:()=>({ground:BASE(-1,-1,10,5).concat([ROOM(0,0,2.6,1.1),ROOM(2.6,0,2.8,1.1),ROOM(5.4,0,2.6,1.1),ROOM(0,1.9,3.6,1.1),ROOM(3.6,1.9,4.4,1.1)]),objs:[box(0,0,8,3,1.6,'ghost')],paths:[[[.2,1.5],[7.7,1.5]]],pathOver:1}),
    centralC:()=>({ground:BASE(-1,-1,8,8).concat([ROOM(0,0,2.2,2.2),ROOM(3.8,0,2.2,2.2),ROOM(0,3.8,2.2,2.2),ROOM(3.8,3.8,2.2,2.2)]),objs:[box(0,0,6,6,1.6,'ghost'),box(2.4,2.4,1.2,1.2,1.9,'acc')],paths:[[[3,2.3],[3,.4]],[[3,3.7],[3,5.6]],[[2.3,3],[.4,3]],[[3.7,3],[5.6,3]]],pathOver:1}),
    perimetral:()=>({ground:BASE(-1,-1,10,8),objs:[box(0,0,8,6,1.6,'ghost'),box(2.2,1.6,3.6,2.8,1.6)],paths:[[[1.1,5.2],[1.1,.8],[6.9,.8],[6.9,5.2],[2.2,5.2]]],pathOver:1}),

  const cache={};
  function fit(sc){

    const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);sc.c=[(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2];
    let b=[1e9,1e9,-1e9,-1e9];
    for(let th=-.85;th<=.16;th+=.1){const c=Math.cos(th),s=Math.sin(th);all.forEach(([x,y,z])=>{const a=sc.c[0]+(x-sc.c[0])*c-(y-sc.c[1])*s,bb=sc.c[1]+(x-sc.c[0])*s+(y-sc.c[1])*c;const X=(a-bb)*C30,Y=(a+bb)*.5-z;b=[Math.min(b[0],X),Math.min(b[1],Y),Math.max(b[2],X),Math.max(b[3],Y)];});}
    sc.k=Math.min((VW-24)/(b[2]-b[0]),(VH-24)/(b[3]-b[1]));sc.ox=VW/2-(b[0]+b[2])/2*sc.k;sc.oy=VH/2-(b[1]+b[3])/2*sc.k;

    const pts=a=>a.map(p=>r2(p[0])+','+r2(p[1])).join(' ');
    let out='';
    sc.ground.forEach(gp=>{out+=`<polygon points="${pts(gp.p.map(q=>P(q[0],q[1],0)))}" fill="${gp.fill}" stroke="${gp.stroke||'none'}" stroke-width="${gp.sw||1}"${gp.dash?` stroke-dasharray="${gp.dash}"`:''}/>`;});
    const items=[];
    sc.objs.forEach(o=>{
      const gz=o.kind==='nb'?1:g,vis=[];
      o.faces.forEach(f=>{

      const svg=vis.map(v=>{const pp=pts(v.q.map(p=>P(...p)));

        if(o.kind==='nb')return `<polygon points="${pp}" fill="${v.f.n[2]>0?'#F6F6F2':'#E9E9E4'}" stroke="#B5B5AE" stroke-width="1"/>`;
        if(o.kind==='ghost')return `<polygon points="${pp}" fill="#fff" fill-opacity=".22" stroke="${INK}" stroke-opacity=".55" stroke-width="1.1" stroke-linejoin="round"/>`;

    const paths=sc.paths.map(pl=>{const q=pl.map(p=>P(p[0],p[1],.05)),e=q[q.length-1],p2=q[q.length-2],an=Math.atan2(e[1]-p2[1],e[0]-p2[0]);
      return `<g opacity="${r2(a2)}"><polyline points="${pts(q)}" fill="none" stroke="${A}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" stroke-dashoffset="${r2(-t*24)}"/><polygon points="${pts([[e[0]+Math.cos(an)*9,e[1]+Math.sin(an)*9],[e[0]+Math.cos(an+2.3)*8,e[1]+Math.sin(an+2.3)*8],[e[0]+Math.cos(an-2.3)*8,e[1]+Math.sin(an-2.3)*8]])}" fill="${A}"/></g>`;}).join('');
    if(!sc.pathOver)out+=paths;
    items.sort((x,y)=>x.d-y.d).forEach(i=>out+=i.s);
    if(sc.pathOver)out+=paths;
    return out;
  }

  // iterar: de la caja a la forma consolidada, transformando 4 volúmenes [x,y,z,w,d,h]
  const IT=[
    {l:'Forma base',b:[[0,0,0,6,4,2.4],[3,0,0,0,4,0],[0,2,0,0,0,0],[2,1,2.4,0,0,0]]},
    {l:'Partir',b:[[0,0,0,2.9,4,2.4],[3.1,0,0,2.9,4,2.4],[0,2,0,0,0,0],[2,1,2.4,0,0,0]]},
    {l:'Empujar',b:[[0,0,0,2.9,4,2.4],[3.1,1.3,0,2.9,4,2.4],[0,2,0,0,0,0],[2,1,2.4,0,0,0]]},
    {l:'Elevar',b:[[0,0,0,2.9,4,2.4],[3.1,1.3,0,2.9,4,3.6],[0,2,0,0,0,0],[2,1,2.4,0,0,0]]},
    {l:'Abrir',b:[[0,0,0,2.9,1.6,2.4],[3.1,1.3,0,2.9,4,3.6],[0,2.6,0,2.9,1.4,2.4],[2,1,2.4,0,0,0]]},
    {l:'Bajar',b:[[0,0,0,2.9,1.6,2.4],[3.1,1.3,0,2.9,4,3.6],[-.5,2.6,0,2.9,1.4,1.2],[2,1,2.4,0,0,0]]},

mBody.addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(b){const [li,oi]=b.dataset.goto.split(',').map(Number);openOpt(li,oi);}});


const h=parseInt((location.hash||'').replace('#',''),10);
if(auto){$('#bPlay').textContent='❚❚';$('#bPlay').classList.add('play-on');}
go(h>0?h-1:0);
})();
</script>
